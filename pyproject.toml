[project]
name = "tarcle"
version = "0.0.1"
description = "Is task space circular? Function-vector geometry for cyclic task families."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.45,<5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tarcle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
